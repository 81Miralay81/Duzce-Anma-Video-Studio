name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Install Android SDK packages
        run: |
          yes | "${{ steps.sdk.outputs.path }}" --licenses >/dev/null || true
          "${{ steps.sdk.outputs.path }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.6.${{ github.run_number }}"
          APK_NAME="Kanatix-Video-Olusturucu-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \
            --repo "${{ github.repository }}" \
            --title "Kanatix Video Oluşturucu ${TAG}" \
            --notes "KANATIX Android APK sürümü ${TAG}. ZIP arşivi değildir; doğrudan APK dosyasını indirin." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Kanatix-Video-Creator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
